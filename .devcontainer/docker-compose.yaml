version: '3'
services:
  ros2:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: ros2
    user: ubuntu
    group_add:
      - dialout
      - tty
      - messagebus
      - video
    volumes:
      - ../:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/:/dev/
      - /run/udev:/run/udev
      - /run/dbus:/run/dbus

    network_mode: host
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
      - PULSE_SERVER
      - UDEV=1
    ports:
      - 5000:5000
    devices:
      - /dev/ttyS0:/dev/ttyS0
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/i2c-1:/dev/i2c-1
      - /dev/i2c-0:/dev/i2c-0
      - /dev/input/:/dev/input/
   


      
    command: /bin/sh -c "while sleep 1000; do :; done"
